<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VERITY — Dark Maze</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;font:14px/1.5 "Courier New",monospace;color:#b9b5ad}
canvas{display:block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;background:#000e;padding:8vh 8vw;z-index:5}
.scr.hide{display:none}
h1{font:400 26px "Courier New",monospace;letter-spacing:.18em;color:#d8d4cc;margin-bottom:14px;text-transform:uppercase}
p{max-width:520px;white-space:pre-line;color:#8d8a83}
button{margin-top:26px;background:none;border:0;border-bottom:1px solid #6b6862;color:#d8d4cc;font:inherit;padding:2px 0;cursor:pointer}
button:hover{color:#fff;border-color:#fff}
button:disabled{opacity:.4;cursor:wait}
#hud{position:fixed;left:20px;bottom:18px;z-index:2;pointer-events:none;color:#a8a49c}
#bar{display:block;width:90px;height:2px;background:#2a2826;margin-top:6px}
#st{display:block;height:100%;background:#a8a49c}
#map{position:fixed;right:16px;top:16px;z-index:2;opacity:.6}
#msg{position:fixed;bottom:18%;left:0;right:0;text-align:center;z-index:2;color:#a8a49c;opacity:0;transition:opacity .6s;pointer-events:none}
#red{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(transparent 40%,#900);opacity:0}
#cross{position:fixed;left:50%;top:50%;width:2px;height:2px;margin:-1px;background:#fff5;z-index:2}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,#000c 115%)}
#grain{position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:.09;animation:g .5s steps(4) infinite}
@keyframes g{0%{transform:translate(0,0)}25%{transform:translate(-6%,4%)}50%{transform:translate(5%,-5%)}75%{transform:translate(-3%,-6%)}100%{transform:translate(0,0)}}
#dbg{position:fixed;left:14px;top:14px;z-index:6;font:12px/1.4 monospace;color:#9f9;background:#000b;padding:8px;max-width:560px;white-space:pre-wrap;display:none;pointer-events:none}
/* debug: screen-edge arrow that points toward Verity when he's off-screen */
#varrow,.carrow{position:fixed;left:0;top:0;z-index:6;display:none;pointer-events:none;color:#f44;font:bold 12px/1 "Courier New",monospace;text-shadow:0 0 4px #000;white-space:nowrap}
#varrow i,.carrow i{display:block;width:0;height:0;margin:0 auto 3px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid #f44;filter:drop-shadow(0 0 3px #000)}
.carrow{color:#3fe}
.carrow i{border-bottom-color:#3fe}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud"><span id="obj"></span><i id="bar"><b id="st"></b></i></div>
<canvas id="map" width="150" height="150"></canvas>
<div id="cross"></div><div id="msg"></div><div id="red"></div><div id="vig"></div><div id="grain"></div>
<div id="varrow"><i id="vtri"></i><span id="vlbl"></span></div>
<div class="scr" id="scr"><h1 id="t">Verity</h1><p id="m"></p><button id="b" disabled>loading 0%</button></div>
<pre id="dbg"></pre>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

/* ============ CONFIG — tweak these to fit your models ============ */
const ASSETS='assets/';
const ARMS_FILE='psx_first_person_arms.glb', ARMS_CLIP='ArmsRig|relax';   // real clip name in the file has no spaces
const ARMS_WIDTH=0.7, ARMS_CENTER=[0,-0.42,-0.55], ARMS_ROT=[0,0,0]; // auto-fit: arms bbox width (m) and where its centre sits in camera space
const VERITY_FILE='veritytm.glb', VERITY_CLIP='verity.mdl|verity.mdl/@CWalk';
const VERITY_H=2.4, VERITY_YAW=0;   // standing height in metres (he crouches while walking), extra facing offset (radians; facing is auto-detected from his feet)
const N=12, T=3;                                          // maze cells per side, tile size
const DEBUG_GODMODE=false;          // false: debug mode (F3) only adds tracers, everything else plays normally. true: also makes Verity unable to catch you while debugging
/* ================================================================= */

const $=id=>document.getElementById(id);
const W=2*N+1;
const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return c};
const rnd=(a,b)=>a+Math.random()*(b-a);
const toTex=(c,srgb)=>{const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t};
$('grain').style.backgroundImage=`url(${mk(128,128,x=>{const d=x.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=Math.random()*255;d.data[i+3]=255}x.putImageData(d,0,0)}).toDataURL()})`;

/* ---------- renderer / scene ---------- */
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
document.body.prepend(R.domElement);
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030405);scene.fog=new THREE.FogExp2(0x030405,.11);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.03,80);cam.rotation.order='YXZ';scene.add(cam);
const amb=new THREE.AmbientLight(0x2a2c36,.5);scene.add(amb);
const torch=new THREE.SpotLight(0xffe8c8,34,24,.4,.65,1.7);
torch.position.set(.15,-.1,0);cam.add(torch,torch.target);torch.target.position.set(0,0,-5);
cam.add(new THREE.PointLight(0xffddbb,.45,3,1.5));
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

/* ---------- maze generation (recursive backtracker + extra loops) ---------- */
const g=Array.from({length:W},()=>Array(W).fill(1));
{const st=[[1,1]];g[1][1]=0;
 while(st.length){const[x,z]=st[st.length-1];
  const n=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>x+a>0&&x+a<W-1&&z+b>0&&z+b<W-1&&g[z+b][x+a]===1).sort(()=>Math.random()-.5);
  if(!n.length){st.pop();continue}
  const[a,b]=n[0];g[z+b/2][x+a/2]=0;g[z+b][x+a]=0;st.push([x+a,z+b]);}
 for(let i=0;i<40;i++){const x=1+Math.random()*(W-2)|0,z=1+Math.random()*(W-2)|0;
  if(g[z][x]===1&&((g[z][x-1]===0&&g[z][x+1]===0)||(g[z-1][x]===0&&g[z+1][x]===0)))g[z][x]=0;}}

function distMap(sx,sz){const d=Array.from({length:W},()=>Array(W).fill(1e9));d[sz][sx]=0;const q=[[sx,sz]];
 for(let i=0;i<q.length;i++){const[x,z]=q[i];
  for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,nz=z+b;
   if(g[nz]?.[nx]===0&&d[nz][nx]>d[z][x]+1){d[nz][nx]=d[z][x]+1;q.push([nx,nz])}}}
 return d}
const solid=(x,z)=>g[Math.round(z/T)]?.[Math.round(x/T)]!==0;

/* ---------- textures + geometry ---------- */
const walls=[];
const grit=(x,w,h,n,al)=>{for(let i=0;i<n;i++){const v=Math.random()<.5?0:255;x.fillStyle=`rgba(${v},${v},${v},${Math.random()*al})`;x.fillRect(Math.random()*w,Math.random()*h,rnd(1,3),rnd(1,3))}};
const stain=(x,w,h,n,col,al)=>{for(let i=0;i<n;i++){const px=rnd(0,w),py=rnd(0,h),r=rnd(20,90),g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,col.replace('A',al*Math.random()));g.addColorStop(1,col.replace('A',0));x.fillStyle=g;x.fillRect(px-r,py-r,2*r,2*r)}};
const cracks=(x,w,h,n,col)=>{x.strokeStyle=col;for(let i=0;i<n;i++){let px=rnd(0,w),py=rnd(0,h);x.lineWidth=rnd(.5,1.8);x.beginPath();x.moveTo(px,py);for(let k=0,m=rnd(6,16);k<m;k++){px+=rnd(-14,14);py+=rnd(2,16);x.lineTo(px,py)}x.stroke()}};
const streaks=(x,w,h,n)=>{for(let i=0;i<n;i++){const len=rnd(60,h),g=x.createLinearGradient(0,0,0,len);g.addColorStop(0,`rgba(10,8,5,${rnd(.1,.35)})`);g.addColorStop(1,'rgba(10,8,5,0)');x.fillStyle=g;x.save();x.translate(rnd(0,w),rnd(0,h-30));x.fillRect(0,0,rnd(2,10),len);x.restore()}};
// brick wall: albedo + bump
const WS=512,cols=6,rows=14,bw=WS/cols,bh=WS/rows;
const wallC=mk(WS,WS,x=>{x.fillStyle='#1d1a17';x.fillRect(0,0,WS,WS)}),wallH=mk(WS,WS,x=>{x.fillStyle='#000';x.fillRect(0,0,WS,WS)});
{const x=wallC.getContext('2d'),h=wallH.getContext('2d');
 for(let r=0;r<rows;r++)for(let c=-1;c<cols;c++){const ox=(r%2?bw/2:0)+c*bw,y=r*bh;
  x.fillStyle=`hsl(${rnd(8,26)},${rnd(18,34)}%,${rnd(16,30)}%)`;x.fillRect(ox+2,y+2,bw-4,bh-4);
  const gr=x.createLinearGradient(0,y,0,y+bh);gr.addColorStop(0,'rgba(255,255,255,.08)');gr.addColorStop(1,'rgba(0,0,0,.25)');x.fillStyle=gr;x.fillRect(ox+2,y+2,bw-4,bh-4);
  const v=rnd(110,200)|0;h.fillStyle=`rgb(${v},${v},${v})`;h.fillRect(ox+2,y+2,bw-4,bh-4)}
 grit(x,WS,WS,2500,.25);streaks(x,WS,WS,26);stain(x,WS,WS,10,'rgba(15,12,8,A)',.5);cracks(x,WS,WS,5,'rgba(0,0,0,.6)');
 const mg=x.createLinearGradient(0,WS*.7,0,WS);mg.addColorStop(0,'rgba(40,60,30,0)');mg.addColorStop(1,'rgba(35,55,25,.35)');x.fillStyle=mg;x.fillRect(0,WS*.7,WS,WS*.3);
 grit(h,WS,WS,3000,.5);cracks(h,WS,WS,5,'#000')}
const wm=(()=>{const mat=new THREE.MeshStandardMaterial({map:toTex(wallC,1),bumpMap:toTex(wallH),bumpScale:4,roughness:.95});
 const n=[];for(let z=0;z<W;z++)for(let x=0;x<W;x++)if(g[z][x])n.push([x,z]);walls.length=0;walls.push(...n);
 return new THREE.InstancedMesh(new THREE.BoxGeometry(T,3.4,T),mat,n.length)})();
const D=new THREE.Object3D();walls.forEach(([x,z],i)=>{D.position.set(x*T,1.7,z*T);D.updateMatrix();wm.setMatrixAt(i,D.matrix)});scene.add(wm);
// concrete slab: albedo + bump + roughness (wet patches are shinier)
function slab(base,wet){const col=mk(512,512,x=>{x.fillStyle=base;x.fillRect(0,0,512,512);grit(x,512,512,4500,.3);stain(x,512,512,14,'rgba(8,8,6,A)',.6);if(wet)stain(x,512,512,5,'rgba(40,6,6,A)',.5);cracks(x,512,512,4,'rgba(0,0,0,.7)');x.strokeStyle='rgba(0,0,0,.8)';x.lineWidth=3;for(const i of[0,256])for(const j of[0,256])x.strokeRect(i,j,256,256)});
 const bump=mk(512,512,x=>{x.fillStyle='#888';x.fillRect(0,0,512,512);grit(x,512,512,5000,.6);cracks(x,512,512,4,'#000');x.strokeStyle='#000';x.lineWidth=4;for(const i of[0,256])for(const j of[0,256])x.strokeRect(i,j,256,256)});
 const rough=mk(512,512,x=>{x.fillStyle='rgb(225,225,225)';x.fillRect(0,0,512,512);stain(x,512,512,wet?9:4,'rgba(70,70,70,A)',1);grit(x,512,512,1500,.3)});
 const m=new THREE.MeshStandardMaterial({map:toTex(col,1),bumpMap:toTex(bump),bumpScale:2,roughnessMap:toTex(rough),roughness:1});
 [m.map,m.bumpMap,m.roughnessMap].forEach(t=>t.repeat.set(W,W));return m}
const mid=(W-1)*T/2;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W*T,W*T),slab('#2a2927',true));floor.rotation.x=-Math.PI/2;floor.position.set(mid,0,mid);scene.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W*T,W*T),slab('#1b1a19',false));ceil.rotation.x=Math.PI/2;ceil.position.set(mid,3.4,mid);scene.add(ceil);

/* ---------- objective items ---------- */
const opens=[];for(let z=0;z<W;z++)for(let x=0;x<W;x++)if(!g[z][x])opens.push([x,z]);
const sm=distMap(1,1);
const exit=opens.reduce((a,b)=>sm[b[1]][b[0]]>sm[a[1]][a[0]]?b:a);
const em=distMap(...exit);
const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,3.4,24,1,true),new THREE.MeshBasicMaterial({color:0xff2222,transparent:true,opacity:.35,side:THREE.DoubleSide,fog:false}));
pillar.position.set(exit[0]*T,1.7,exit[1]*T);scene.add(pillar);
const exitLight=new THREE.PointLight(0xff2222,12,12,2);exitLight.position.set(exit[0]*T,1.5,exit[1]*T);scene.add(exitLight);
const cores=[];
// a core may only spawn in an open maze cell whose centre is not solid
const coreOK=c=>g[c[1]]?.[c[0]]===0&&!solid(c[0]*T,c[1]*T);
const addCore=c=>{
 const m=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.38,16),new THREE.MeshStandardMaterial({color:0x113333,emissive:0x33ffee,emissiveIntensity:1.4,roughness:.3,metalness:.4}));
 m.position.set(c[0]*T,1.1,c[1]*T);m.tx=c[0];m.tz=c[1];
 const l=new THREE.PointLight(0x33ffee,6,9,2);m.add(l);scene.add(m);cores.push(m)};
// pass 1 uses the original spacing rules; later passes only relax them if the maze is too small to fit 5 cores
for(const[sep,minStart,minExit]of[[8,8,6],[5,4,3],[2,1,1]])
 for(let tries=0;cores.length<5&&tries<3000;tries++){
  const c=opens[Math.random()*opens.length|0];
  if(!coreOK(c)||sm[c[1]][c[0]]<minStart||em[c[1]][c[0]]<minExit||cores.some(o=>Math.abs(o.tx-c[0])+Math.abs(o.tz-c[1])<sep))continue;
  addCore(c)}
const GOAL=cores.length;let got=0;

/* ---------- wall decals + floor debris ---------- */
function decal(kind){const c=mk(256,256,x=>{
 if(kind===0){x.strokeStyle='rgba(90,8,8,.8)';for(let i=0;i<6;i++){x.lineWidth=rnd(6,16);x.beginPath();let px=rnd(40,216),py=rnd(30,80);x.moveTo(px,py);for(let k=0;k<5;k++){px+=rnd(-20,20);py+=rnd(20,40);x.lineTo(px,py)}x.stroke()}}
 else if(kind===1){x.strokeStyle='rgba(210,200,185,.55)';for(let i=0;i<14;i++){x.lineWidth=rnd(1,3);const px=rnd(60,196);x.beginPath();x.moveTo(px,rnd(40,90));x.lineTo(px+rnd(-25,25),rnd(150,220));x.stroke()}}
 else{x.fillStyle='rgba(120,10,10,.85)';x.font='bold 46px Courier New';x.textAlign='center';x.save();x.translate(128,140);x.rotate(rnd(-.15,.15));x.fillText(['RUN','HE SEES','LEAVE','NO EXIT'][Math.random()*4|0],0,0);x.restore();for(let i=0;i<8;i++)x.fillRect(rnd(30,226),150,2,rnd(10,50))}});
 return new THREE.MeshStandardMaterial({map:toTex(c,1),transparent:true,roughness:1,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2})}
{const mats=[0,1,2,2,0].map(decal),dg=new THREE.PlaneGeometry(1.3,1.3);
 for(let i=0,n=0;n<28&&i<900;i++){const[x,z]=walls[Math.random()*walls.length|0];
  const nb=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>g[z+b]?.[x+a]===0);if(!nb.length)continue;const[a,b]=nb[Math.random()*nb.length|0];
  const m=new THREE.Mesh(dg,mats[Math.random()*mats.length|0]);m.position.set(x*T+a*1.505,rnd(.9,1.9),z*T+b*1.505);m.rotation.y=Math.atan2(a,b);scene.add(m);n++}
 const dm=new THREE.InstancedMesh(new THREE.BoxGeometry(.18,.04,.12),new THREE.MeshStandardMaterial({color:0x4a4038,roughness:1}),180);
 for(let i=0;i<180;i++){const o=opens[Math.random()*opens.length|0];D.position.set(o[0]*T+rnd(-1.2,1.2),.02,o[1]*T+rnd(-1.2,1.2));D.rotation.set(rnd(-.2,.2),rnd(0,6.3),rnd(-.2,.2));D.scale.setScalar(rnd(.5,2.2));D.updateMatrix();dm.setMatrixAt(i,D.matrix)}scene.add(dm)}

/* ---------- Verity ---------- */
const V=new THREE.Group();scene.add(V);
{const c=opens.filter(o=>sm[o[1]][o[0]]>=20);const s=c.length?c[Math.random()*c.length|0]:exit;V.position.set(s[0]*T,0,s[1]*T)}
V.add(new THREE.PointLight(0xff2222,5,7,2));V.children[0].position.y=1.5;
let vMix=null,vYaw=0;

/* ---------- debug tracers: always-visible (through walls) markers showing where Verity is ---------- */
const TR=new THREE.Group();TR.visible=false;scene.add(TR);
const trMat=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,depthTest:false,depthWrite:false,fog:false,side:THREE.DoubleSide});
const trTag=(m,ro=999)=>{m.renderOrder=ro;m.frustumCulled=false;return m};
const trLine=trTag(new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,1,6).rotateX(Math.PI/2),trMat(0xff3333,.75))); // player -> Verity line (cylinder along +Z so it has real thickness)
const trBeam=trTag(new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,12,10,1,true),trMat(0xff3333,.5)));               // tall beacon you can spot over the walls
const trRing=trTag(new THREE.Mesh(new THREE.RingGeometry(.8,1,32).rotateX(-Math.PI/2),trMat(0xff3333,.85)));          // floor ring under his feet
const trOrb=trTag(new THREE.Mesh(new THREE.SphereGeometry(.22,12,8),trMat(0xffaa22,.95)));                          // marker at chest height
TR.add(trLine,trBeam,trRing,trOrb);
const TRAIL=80,trailQ=[];let trailT=0;                                  // breadcrumb trail of where he has been (sampled every .2s)
const trailPts=new Float32Array((TRAIL+1)*3);
const trail=trTag(new THREE.Line(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(trailPts,3)),new THREE.LineBasicMaterial({color:0xff8844,transparent:true,opacity:.85,depthTest:false,depthWrite:false,fog:false})),998);
trail.geometry.setDrawRange(0,0);TR.add(trail);
const varrow=$('varrow');
const _a=new THREE.Vector3(),_b=new THREE.Vector3(),_c=new THREE.Vector3(),_p=new THREE.Vector3();
// core tracers: cyan beacon + floor ring + orb + edge arrow on every uncollected core, and a line to the nearest one
const trCoreLine=trTag(new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,1,6).rotateX(Math.PI/2),trMat(0x33ffee,.6)));TR.add(trCoreLine);
{const bg=new THREE.CylinderGeometry(.08,.08,12,10,1,true),rg=new THREE.RingGeometry(.5,.65,32).rotateX(-Math.PI/2),og=new THREE.SphereGeometry(.16,12,8),bm=trMat(0x33ffee,.45),rm=trMat(0x33ffee,.85),om=trMat(0xaafff6,.95);
 cores.forEach(c=>{const tr=new THREE.Group();
  tr.add(trTag(new THREE.Mesh(bg,bm)),trTag(new THREE.Mesh(rg,rm)),trTag(new THREE.Mesh(og,om)));
  tr.children[0].position.y=4.5;tr.children[1].position.y=.06;TR.add(tr);c.tr=tr;
  const el=document.createElement('div');el.className='carrow';el.innerHTML='<i></i><span></span>';document.body.appendChild(el);c.arrow=el})}
// positions an edge-of-screen arrow toward a world point (hidden while the point is on-screen)
function placeArrow(el,pos){
 _p.copy(pos).project(cam);
 const behind=_p.z>1,off=behind||Math.abs(_p.x)>.92||Math.abs(_p.y)>.92;
 if(!off){el.style.display='none';return}
 let sx=behind?-_p.x:_p.x,sy=behind?-_p.y:_p.y;const m=Math.max(Math.abs(sx),Math.abs(sy),1e-6);
 sx=sx/m*.86;sy=sy/m*.86;
 el.style.display='block';
 el.style.transform=`translate(${(sx*.5+.5)*innerWidth}px,${(-sy*.5+.5)*innerHeight}px) translate(-50%,-50%)`;
 el.firstElementChild.style.transform=`rotate(${Math.atan2(sx*innerWidth,sy*innerHeight)}rad)`;
 el.lastElementChild.textContent=Math.hypot(pos.x-P.x,pos.z-P.z).toFixed(0)+'m'}
function updateTracers(){
 const vx=V.position.x,vz=V.position.z;
 _a.set(P.x,1,P.z);_b.set(vx,1.2,vz);const len=_a.distanceTo(_b);
 trLine.position.copy(_a).add(_b).multiplyScalar(.5);trLine.scale.z=Math.max(len,.001);if(len>.01)trLine.lookAt(_b);
 const pulse=1+.15*Math.sin(performance.now()/150);
 trBeam.position.set(vx,4.5,vz);
 trRing.position.set(vx,.06,vz);trRing.scale.setScalar(pulse);
 trOrb.position.set(vx,1.2,vz);trOrb.scale.setScalar(pulse);
 // trail
 const n=trailQ.length;
 for(let i=0;i<n;i++){trailPts[i*3]=trailQ[i][0];trailPts[i*3+1]=.15;trailPts[i*3+2]=trailQ[i][1]}
 trailPts[n*3]=vx;trailPts[n*3+1]=.15;trailPts[n*3+2]=vz;
 trail.geometry.setDrawRange(0,n+1);trail.geometry.attributes.position.needsUpdate=true;
 placeArrow(varrow,_b);
 // cores
 let near=null,nd=1e9;
 for(const c of cores){const d=Math.hypot(c.position.x-P.x,c.position.z-P.z);if(d<nd){nd=d;near=c}
  c.tr.position.set(c.position.x,0,c.position.z);c.tr.children[1].scale.setScalar(pulse);c.tr.children[2].position.y=c.position.y;
  placeArrow(c.arrow,c.position)}
 trCoreLine.visible=!!near;
 if(near){_c.copy(near.position);trCoreLine.position.copy(_a).add(_c).multiplyScalar(.5);trCoreLine.scale.z=Math.max(_a.distanceTo(_c),.001);trCoreLine.lookAt(_c)}}

/* ---------- loading models ---------- */
const mgr=new THREE.LoadingManager();const gl=new GLTFLoader(mgr);
mgr.onProgress=(u,i,n)=>{$('b').textContent='loading '+Math.round(i/n*100)+'%'};
const load=f=>new Promise(r=>gl.load(ASSETS+f,r,undefined,e=>{console.warn('Could not load '+ASSETS+f,e);r(null)}));
const clean=x=>x.toLowerCase().replace(/\s+/g,'');
const findClip=(a,name)=>{const n=clean(name),t=n.split(/[|\/]/).pop();return a.find(c=>clean(c.name)===n)||a.find(c=>clean(c.name).endsWith(t))||a[0]};
let DEBUG=false,aMix=null,armsRig=null,verRig=null;
const info={arms:'FAILED to load '+ASSETS+ARMS_FILE,verity:'FAILED to load '+ASSETS+VERITY_FILE+' (red capsule used)'};
const V3=()=>new THREE.Vector3();
// precise skinned bounding box of a model, measured detached from the scene
function measure(root,minV=0){const p=root.parent;if(p)p.remove(root);root.updateMatrixWorld(true);const b=new THREE.Box3();
 root.traverse(o=>{if(o.isMesh&&o.geometry.attributes.position.count>=minV){o.skeleton?.update();b.expandByObject(o,true)}});
 if(p)p.add(root);return b}
function rig(gltf,clipName){const root=gltf.scene;root.traverse(o=>{if(o.isMesh)o.frustumCulled=false});
 console.log('Animations in file:',gltf.animations.map(a=>a.name));
 const mix=new THREE.AnimationMixer(root),clip=findClip(gltf.animations,clipName);
 return{root,mix,clip,act:clip?mix.clipAction(clip):null,n:gltf.animations.length}}
function placeArms(){const r=armsRig.root;cam.remove(r);r.position.set(0,0,0);const c=measure(r).getCenter(V3());
 r.position.set(ARMS_CENTER[0]-c.x,ARMS_CENTER[1]-c.y,ARMS_CENTER[2]-c.z);cam.add(r)}
const vh=new THREE.Group();V.add(vh);
function placeVerity(){const m=verRig.root;m.position.set(0,0,0);const b=measure(m,50),c=b.getCenter(V3());m.position.set(-c.x,-b.min.y,-c.z)}
const [gA,gV]=await Promise.all([load(ARMS_FILE),load(VERITY_FILE)]);
if(gA){armsRig=rig(gA,ARMS_CLIP);const r=armsRig.root;r.rotation.set(...ARMS_ROT);
 const sz=measure(r).getSize(V3()),s=ARMS_WIDTH/(sz.x||1);r.scale.setScalar(s);aMix=armsRig.mix;
 info.arms=`loaded | clip: ${armsRig.clip?.name??'NONE'} (of ${armsRig.n}) | native size ${sz.x.toFixed(1)}x${sz.y.toFixed(1)}x${sz.z.toFixed(1)} | scale ${s.toExponential(2)}`}
if(gV){verRig=rig(gV,VERITY_CLIP);const m=verRig.root;vh.add(m);vMix=verRig.mix;
 const sz=measure(m,50).getSize(V3()),s=VERITY_H/(sz.y||1);m.scale.setScalar(s);
 const f=m.getObjectByName('Foot_L_06'),t=m.getObjectByName('Toe_L_07');let yaw0=0;
 if(f&&t){m.updateMatrixWorld(true);const a=f.getWorldPosition(V3()),b=t.getWorldPosition(V3());yaw0=-Math.atan2(b.x-a.x,b.z-a.z)}
 vh.rotation.y=yaw0+VERITY_YAW;
 info.verity=`loaded | clip: ${verRig.clip?.name??'NONE'} (of ${verRig.n}) | native height ${sz.y.toFixed(1)} | scale ${s.toFixed(4)} | auto-yaw ${(yaw0*57.3).toFixed(0)}deg`}
else{const f=new THREE.Mesh(new THREE.CapsuleGeometry(.4,1.5,4,8),new THREE.MeshStandardMaterial({color:0x550000}));f.position.y=1.15;V.add(f)}

/* ---------- audio ---------- */
let AC;
function initAudio(){AC=new AudioContext();const m=AC.createGain();m.gain.value=.5;m.connect(AC.destination);AC.out=m;
 [40,41.7].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;l.type='lowpass';l.frequency.value=140;g.gain.value=.07;o.connect(l);l.connect(g);g.connect(m);o.start()})}
function tone(f,f2,d,v,type='sine'){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;
 o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(AC.out);o.start(t);o.stop(t+d)}

/* ---------- UI ---------- */
let state='menu',msgT;
function screen(t,m,b){$('t').textContent=t;$('m').textContent=m;$('b').textContent=b;$('b').disabled=false;$('scr').classList.remove('hide')}
function say(t,ms=3500){const e=$('msg');e.textContent=t;e.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>e.style.opacity=0,ms)}
screen('Verity',`Find ${GOAL} power cores to unlock the exit, then get out.\nVerity hunts by sound. Sprinting is loud.\n\nWASD move / shift sprint / mouse look / esc pause`,'begin');
$('b').onclick=()=>{if(state==='menu'||state==='pause'){if(!AC)initAudio();R.domElement.requestPointerLock();state='play';$('scr').classList.add('hide');clock.getDelta()}else location.reload()};
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==R.domElement&&state==='play'){state='pause';screen('Paused','','resume')}});
const keys={};addEventListener('keydown',e=>keys[e.code]=1);addEventListener('keyup',e=>keys[e.code]=0);
let yaw=0,pitch=0;
addEventListener('mousemove',e=>{if(state!=='play')return;yaw-=e.movementX*.0023;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.0023))});

/* ---------- game state ---------- */
const P={x:T,z:T};{const o=[[1,0],[0,1],[-1,0],[0,-1]].find(([a,b])=>g[1+b]?.[1+a]===0);if(o)yaw=Math.atan2(o[0],o[1])+Math.PI}
let stam=100,tired=false,sprinting=false,bob=0,hb=1,hunt=0,vMode='patrol',vLost=0,pKey='',pmap=null,patT=null,patMap=null,deadT=0;
const exp=Array.from({length:W},()=>Array(W).fill(false));
const mc=$('map').getContext('2d');

function move(dx,dz){const r=.4;
 for(const[ax,az]of[[dx,0],[0,dz]]){const nx=P.x+ax,nz=P.z+az;
  if(![[r,r],[-r,r],[r,-r],[-r,-r]].some(([a,b])=>solid(nx+a,nz+b))){P.x=nx;P.z=nz}}}

function updateVerity(dt){
 const vt=[Math.round(V.position.x/T),Math.round(V.position.z/T)],pt=[Math.round(P.x/T),Math.round(P.z/T)];
 if(pt.join()!==pKey||!pmap){pmap=distMap(...pt);pKey=pt.join()}
 const pd=pmap[vt[1]][vt[0]];hunt-=dt;
 if(hunt>0||pd<=(sprinting?16:9)){vMode='chase';vLost=0}else if(vMode==='chase'&&(vLost+=dt)>5)vMode='patrol';
 let map=pmap,spd=3+.35*got;
 if(vMode==='patrol'){spd=1.8;
  if(!patT||(vt[0]===patT[0]&&vt[1]===patT[1])){patT=opens[Math.random()*opens.length|0];patMap=distMap(...patT)}
  map=patMap}
 let tx=P.x,tz=P.z;
 if(map[vt[1]][vt[0]]>0){let best=null,bd=1e9;
  for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const d=map[vt[1]+b]?.[vt[0]+a]??1e9;if(d<bd){bd=d;best=[vt[0]+a,vt[1]+b]}}
  if(best){tx=best[0]*T;tz=best[1]*T}}
 else if(vMode==='patrol'){tx=V.position.x;tz=V.position.z}
 const dx=tx-V.position.x,dz=tz-V.position.z,l=Math.hypot(dx,dz);
 if(l>.05){const s=Math.min(l,spd*dt);V.position.x+=dx/l*s;V.position.z+=dz/l*s;
  let ty=Math.atan2(dx,dz),df=ty-vYaw;df=Math.atan2(Math.sin(df),Math.cos(df));vYaw+=df*Math.min(1,dt*8);V.rotation.y=vYaw}
 if(vMix)vMix.timeScale=vMode==='chase'?1.5:.9;
 return Math.hypot(P.x-V.position.x,P.z-V.position.z)}

const JS=new Audio(ASSETS+'jumpscare.MP3');JS.preload='auto';let jsFail=false;JS.addEventListener('error',()=>jsFail=true);
let vf=0,prevMode='patrol';
function die(){state='dead';deadT=0;document.exitPointerLock();$('red').style.opacity=.6;
 V.position.set(P.x-Math.sin(yaw)*1.1,0,P.z-Math.cos(yaw)*1.1);vYaw=Math.atan2(P.x-V.position.x,P.z-V.position.z);V.rotation.y=vYaw;if(vMix)vMix.timeScale=2.2;
 const fb=()=>tone(900,80,1.2,.5,'sawtooth');JS.currentTime=0;if(jsFail)fb();else JS.play().catch(fb);
 setTimeout(()=>screen('Caught','','try again'),2400)}

function tick(dt){
 const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),mv=f||r;
 sprinting=!!((keys.ShiftLeft||keys.ShiftRight)&&mv&&stam>0&&!tired);
 if(sprinting){stam-=30*dt;if(stam<=0){stam=0;tired=true}}else{stam=Math.min(100,stam+(mv?12:22)*dt);if(tired&&stam>30)tired=false}
 const spd=sprinting?5.6:3.4;
 if(mv){const l=Math.hypot(f,r),s=Math.sin(yaw),c=Math.cos(yaw),pb=Math.sin(bob);
  move((-s*f+c*r)/l*spd*dt,(-c*f-s*r)/l*spd*dt);bob+=dt*spd*2.1;
  if(pb*Math.sin(bob)<0)tone(110,50,.09,.07,'triangle')}
 cam.position.set(P.x,1.6+(mv?Math.sin(bob)*.04:0),P.z);cam.rotation.set(pitch,yaw,0);

 const vd=updateVerity(dt);
 if(!(DEBUG&&DEBUG_GODMODE)&&vd<1.2&&vMode==='chase')return die();
 // sample Verity's position for the debug trail
 if((trailT+=dt)>.2){trailT=0;trailQ.push([V.position.x,V.position.z]);if(trailQ.length>TRAIL)trailQ.shift()}
 if(vMode==='chase'&&prevMode!=='chase')tone(110,40,.9,.5,'sawtooth');prevMode=vMode;
 vf-=dt;if(vd<20&&vf<=0){tone(70,35,.15,Math.max(.02,.5*(1-vd/20)),'triangle');vf=vMode==='chase'?.32:.6}
 if(Math.random()<dt*.15)tone(rnd(1800,2600),1100,.06,.03);
 cam.fov+=((sprinting?82:75)-cam.fov)*Math.min(1,dt*6);cam.updateProjectionMatrix();

 for(let i=cores.length-1;i>=0;i--){const c=cores[i];c.rotation.y+=dt*2;c.position.y=1.1+Math.sin(performance.now()/400+i)*.12;
  if(Math.hypot(P.x-c.position.x,P.z-c.position.z)<1.3){scene.remove(c);TR.remove(c.tr);c.arrow.remove();cores.splice(i,1);got++;hunt=10;tone(660,1320,.5,.25);
   if(got===GOAL){pillar.material.color.set(0x22ff66);exitLight.color.set(0x22ff66);}}}
 if(Math.hypot(P.x-exit[0]*T,P.z-exit[1]*T)<1.5){
  if(got>=GOAL){state='win';document.exitPointerLock();setTimeout(()=>screen('Escaped','','play again'),300)}
  else say(`The gate is sealed. ${GOAL-got} core${GOAL-got>1?'s':''} missing.`,1500)}

 hb-=dt;if(hb<=0){if(vd<24){tone(60,35,.25,.9);hb=.3+vd/30}else hb=1}
 torch.intensity=(vd<10&&Math.random()<(10-vd)/25?7+Math.random()*16:34)*(.95+Math.random()*.05);
 $('red').style.opacity=Math.max(0,Math.min(.55,1-vd/10));
 $('st').style.width=stam+'%';$('st').style.background=tired?'#6b3a36':'#a8a49c';
 $('obj').textContent=got<GOAL?`cores ${got}/${GOAL}`:'exit open';

 const px=Math.round(P.x/T),pz=Math.round(P.z/T);
 for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++)if(exp[pz+b])exp[pz+b][px+a]=true;
 mc.clearRect(0,0,150,150);const s=150/W;
 for(let z=0;z<W;z++)for(let x=0;x<W;x++)if(exp[z][x]){mc.fillStyle=g[z][x]?'#151515':'#4a3a3a';mc.fillRect(x*s,z*s,s,s)}
 if(exp[exit[1]][exit[0]]){mc.fillStyle=got>=GOAL?'#2f6':'#f33';mc.fillRect(exit[0]*s,exit[1]*s,s,s)}
 mc.fillStyle='#3fe';cores.forEach(c=>{if(DEBUG||exp[c.tz][c.tx])mc.fillRect(c.tx*s+1,c.tz*s+1,s-2,s-2)});
 const ux=P.x/T*s+s/2,uz=P.z/T*s+s/2;mc.fillStyle='#fff';mc.fillRect(ux-2,uz-2,4,4);
 mc.strokeStyle='#fff';mc.beginPath();mc.moveTo(ux,uz);mc.lineTo(ux-Math.sin(yaw)*9,uz-Math.cos(yaw)*9);mc.stroke();
 // debug: Verity is always shown on the minimap (even in unexplored areas), with a tracer line + his trail
 if(DEBUG){const vx=V.position.x/T*s+s/2,vz=V.position.z/T*s+s/2;
  mc.strokeStyle='#ff884488';mc.beginPath();trailQ.forEach(([x,z],i)=>{const a=x/T*s+s/2,b=z/T*s+s/2;i?mc.lineTo(a,b):mc.moveTo(a,b)});mc.lineTo(vx,vz);mc.stroke();
  mc.strokeStyle='#f33';mc.beginPath();mc.moveTo(ux,uz);mc.lineTo(vx,vz);mc.stroke();
  mc.fillStyle='#f33';mc.fillRect(vx-3,vz-3,6,6);mc.strokeRect(vx-6,vz-6,12,12)}}

/* ---------- debug mode (F3): tracers only ---------- */
function setDebug(on){DEBUG=on;TR.visible=on;$('dbg').style.display=on?'block':'none';if(!on){varrow.style.display='none';cores.forEach(c=>c.arrow.style.display='none')}}
addEventListener('keydown',e=>{if(e.code==='F3'){e.preventDefault();setDebug(!DEBUG)}});
const dbgText=()=>{
 const dx=V.position.x-P.x,dz=V.position.z-P.z;
 let rel=Math.atan2(-dx,-dz)-yaw;rel=Math.atan2(Math.sin(rel),Math.cos(rel));   // + = to your left
 const deg=Math.abs(rel*57.3)|0,dir=deg<10?'ahead':deg>150?'behind you':deg+'deg '+(rel>0?'left':'right');
 let cd=1e9;for(const c of cores)cd=Math.min(cd,Math.hypot(c.position.x-P.x,c.position.z-P.z));
 return `DEBUG (F3 toggles)${DEBUG_GODMODE?' - god mode':''}\nVerity ${V.position.x.toFixed(1)},${V.position.z.toFixed(1)}  Player ${P.x.toFixed(1)},${P.z.toFixed(1)}\nTRACER  dist ${Math.hypot(dx,dz).toFixed(1)}m  bearing ${dir}  mode ${vMode}\nCORES   ${cores.length} left${cores.length?`, nearest ${cd.toFixed(1)}m`:''}`}

/* ---------- main loop ---------- */
const clock=new THREE.Clock();
$('b').disabled=false;$('b').textContent='begin';
cam.position.set(P.x,1.6,P.z);cam.rotation.set(0,yaw,0);
for(const r of [armsRig,verRig])if(r?.act){r.act.reset().setLoop(THREE.LoopRepeat,Infinity).play();r.mix.update(0)}
if(armsRig)placeArms();if(verRig)placeVerity();
setDebug(DEBUG);
R.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.05);aMix?.update(dt);vMix?.update(dt);
 if(state==='play')tick(dt);
 else if(state==='dead'){deadT+=dt;cam.position.set(P.x+rnd(-.03,.03),1.6+rnd(-.03,.03),P.z+rnd(-.03,.03));cam.lookAt(V.position.x,1.5,V.position.z)}
 if(DEBUG){updateTracers();$('dbg').textContent=dbgText()}
 R.render(scene,cam)});
</script>
</body>
</html>
